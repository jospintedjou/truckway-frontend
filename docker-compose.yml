# Production:  docker compose --profile prod up -d --build      -> http://<server>:${WEB_PORT:-8020}
# Development: docker compose --profile dev up --build          -> http://localhost:5173
# The backend runs from ../backend with its own compose file.

services:
  prod:
    profiles: ["prod"]
    restart: always
    build:
      context: .
      dockerfile: ./docker/prod/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8021}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-8020}:80"

  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: ./docker/dev/Dockerfile
    environment:
      DEV_API_PROXY: ${DEV_API_PROXY_DOCKER:-http://host.docker.internal:8000}
      CHOKIDAR_USEPOLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
